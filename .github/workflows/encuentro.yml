name: Encuentro (manual)

# No forma parte del estado de validez del commit.
# Disparo manual: EXP-A (κ histórico) y EXP-E (alineación de dominio náhuatl).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encounter:
    name: EXP-A / EXP-E (encuentro)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Verify EXP-A (independent evaluation) and EXP-E (domain mapping)
        run: |
          npx tsx -e "
            import { generateArtifacts, loadIndependentEvalData, scoreIndependentEval, validateDomainMapping } from './src/iomEngine';
            const { annotations, ruleReference } = loadIndependentEvalData();
            const ev = scoreIndependentEval(annotations, ruleReference);
            const dm = validateDomainMapping(generateArtifacts());
            console.log('EXP-A kappa:', ev.fleiss_kappa, 'status:', ev.status);
            console.log('EXP-E summary:', { ok: dm.ok, warn: dm.warn, fail: dm.fail });
          "
