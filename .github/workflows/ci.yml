name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Workflow de validez del repositorio Node.js / TypeScript.
# Encuentro (EXP-A/E) vive en workflows/encuentro.yml (manual).

jobs:
  core:
    name: Núcleo autónomo (tipos, pruebas unitarias, compilación)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Strict TypeScript check
        run: npm run lint
      - name: Unit tests (FormalRules, Teseractos {4,3,3}, Grafo D3, Auditoría JSON)
        run: npx tsx --test src/iomEngine.test.ts src/tesseractFlowGraph.test.ts src/evalAuditExport.test.ts
      - name: Build frontend bundle
        run: npm run build
      - name: Verify fixed-point invariance and tesseract model invariants
        run: |
          npx tsx -e "
            import assert from 'node:assert/strict';
            import { generateArtifacts, runInvarianceAudit, buildTesseractModel } from './src/iomEngine';
            const artifacts = generateArtifacts();
            assert.equal(artifacts.fixedPoint.idempotent, true);
            const inv = runInvarianceAudit(artifacts.relationCandidates);
            assert.equal(inv.invariance_non_trivial, true);
            assert.equal(inv.negative_control.detects_corruption, true);
            const t = buildTesseractModel();
            assert.equal(t.verification.totalRelations, 16);
            assert.equal(t.verification.allRealUseRightArrow, true);
            assert.equal(t.verification.allHaveOneRealOneVirtual, true);
            assert.equal(t.verification.allCubeLinesMatchHeader, true);
            assert.equal(t.verification.allSevenConceptsCovered, true);
            console.log('Core invariants verified:', artifacts.fixedPoint.pass1Hash);
          "
