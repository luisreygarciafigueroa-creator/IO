name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Workflow de validez del repositorio Node.js / TypeScript.
# Encuentro (EXP-A/E) vive en workflows/encuentro.yml (manual).

jobs:
  core:
    name: Núcleo autónomo (tipos, pruebas unitarias, compilación)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Strict TypeScript check
        run: npm run lint
      - name: Unit tests (FormalRules, Núcleo TCAAU, Teseractos {4,3,3}, Grafo D3, Auditoría JSON & Panel specData)
        run: npx tsx --test src/iomEngine.test.ts src/tcaauCore.test.ts src/tesseractFlowGraph.test.ts src/evalAuditExport.test.ts src/specJsonSyntax.test.ts
      - name: Build frontend bundle
        run: npm run build
      - name: Verify fixed-point invariance, TCAAU formal core, and tesseract model invariants
        run: |
          npx tsx -e "
            import assert from 'node:assert/strict';
            import { generateArtifacts, runInvarianceAudit, buildTesseractModel } from './src/iomEngine';
            import { verifyTcaauCore } from './src/tcaauCore';
            const artifacts = generateArtifacts();
            assert.equal(artifacts.fixedPoint.idempotent, true);
            const inv = runInvarianceAudit(artifacts.relationCandidates);
            assert.equal(inv.invariance_non_trivial, true);
            assert.equal(inv.negative_control.detects_corruption, true);
            const t = buildTesseractModel();
            assert.equal(t.verification.totalRelations, 16);
            assert.equal(t.verification.allRealUseRightArrow, true);
            assert.equal(t.verification.allHaveOneRealOneVirtual, true);
            assert.equal(t.verification.allHaveOneContinuousOneDashed, true);
            assert.equal(t.verification.allCubeLinesMatchHeader, true);
            assert.equal(t.verification.coloringsCount, 12);
            assert.equal(t.verification.allAnalysisChainsBalanced, true);
            assert.equal(t.verification.allParityMirrorChainsBalanced, true);
            assert.equal(t.verification.allMirrorChainsBalanced, true);
            assert.equal(t.verification.allMirrorReflectedChainsBalanced, true);
            assert.equal(t.verification.allColoringInvolutionsExact, true);
            assert.equal(t.verification.allColoringsClosed, true);
            assert.equal(t.verification.allConceptsCovered, true);
            assert.equal(t.verification.allCubeLabelsCovered, true);
            assert.equal(t.verification.cleanFormCellCount, 8);
            assert.equal(t.verification.cleanFormTransitionCount, 16);
            assert.equal(t.verification.cleanFormCheckerboardDomainValid, true);
            assert.equal(t.verification.cleanFormOneLoopPerCell, true);
            assert.equal(t.verification.cleanFormEachArrowBalancedByDomain, true);
            assert.equal(t.verification.cleanFormAllHaveOneRealOneVirtual, true);
            assert.equal(t.verification.cleanFormOmitsPolarityLabels, true);
            assert.equal(t.verification.cleanFormAllHorizontalMirrorsExact, true);
            assert.equal(t.verification.cleanFormAllVerticalMirrorsExact, true);
            assert.equal(t.verification.cleanFormVerified, true);
            const tcaau = verifyTcaauCore();
            assert.equal(tcaau.valid, true);
            assert.equal(tcaau.coreHashIdempotent, true);
            assert.equal(tcaau.countsMatchLiveEngine, true);
            assert.equal(tcaau.diagram2x4Verified.eachArrowBalancedByDomain, true);
            assert.equal(tcaau.diagram2x4Verified.checkerboardDomainMatches, true);
            assert.equal(tcaau.diagram2x4Verified.loopReadingExact, true);
            assert.equal(tcaau.section11Verified.gActionFreeAndTransitive, true);
            assert.equal(tcaau.section11Verified.antipodalMatchesSumMod2, true);
            assert.equal(tcaau.section11Verified.siteIntegrationComplete, true);
            assert.equal(tcaau.section11Verified.manifestFilePresent, true);
            assert.equal(tcaau.ideaCount, 8);
            assert.equal(tcaau.researchProblemCount, 7);
            console.log('Core invariants verified:', artifacts.fixedPoint.pass1Hash, tcaau.corePass1Hash);
          "
